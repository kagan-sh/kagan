name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mutants:
        description: Run cargo-mutants on the Rust lines changed since main
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.scope.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        name: Classify the diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          case $EVENT in
            pull_request) files=$(git diff --name-only "origin/${BASE_REF}...HEAD") ;;
            push) files=$(git diff --name-only "$BEFORE" HEAD 2>/dev/null || git diff --name-only HEAD^1 HEAD) ;;
            *) files= ;;
          esac
          skip=false
          if printf '%s\n' "$files" | sh scripts/ci-changes.sh | grep -qx skip; then
            skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  checks:
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Test commit-msg hook
        run: sh .githooks/commit-msg-test
      - name: Test pre-push hook
        run: sh .githooks/pre-push-test
      - id: typos
        run: echo "version=$(tr -d '[:space:]' < scripts/typos-version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: typos@${{ steps.typos.outputs.version }}
      - run: typos --config .config/typos.toml
      - name: Glossary
        run: sh scripts/glossary-check.sh
      - name: View colors
        run: |
          sh scripts/view-colors.sh
          dir=$(mktemp -d)
          mkdir -p "$dir/crates/ui/src"
          for literal in 0x2a251f_u32 0x2a251fff; do
            printf 'const C: u32 = %s;\n' "$literal" > "$dir/crates/ui/src/paint.rs"
            if sh scripts/view-colors.sh "$dir"; then
              echo "view-colors: $literal passed" >&2
              exit 1
            fi
          done
      - name: Reject AI attribution
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh .githooks/check-attribution
      - if: needs.scope.outputs.skip != 'true'
        run: npx jscpd@5.4.0 --config .config/jscpd.json
      - if: needs.scope.outputs.skip != 'true'
        name: Size budget
        run: sh scripts/size-budget.sh
      - if: needs.scope.outputs.skip != 'true'
        run: rustup toolchain install --profile minimal
      - if: needs.scope.outputs.skip != 'true'
        run: cargo fmt --check

  hygiene:
    needs: scope
    if: needs.scope.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install --profile minimal
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny@0.20.2,cargo-shear@1.13.0
      - run: cargo deny --config .config/deny.toml check advisories licenses bans sources
      - run: cargo shear
      - name: Crate boundaries
        run: sh scripts/crate-boundaries.sh

  linux:
    needs: [scope, checks]
    if: needs.scope.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1 libasound2-dev lld
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: nextest
        run: echo "version=$(sed -n 's/^cargo-nextest = { version = "=\([^"]*\)".*/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest@${{ steps.nextest.outputs.version }}
      - name: Watch disk and memory
        run: |
          df -h / ; free -m ; nproc
          du -sh target ~/.cargo 2>/dev/null; ls target 2>/dev/null; du -sh target/* 2>/dev/null
          sudo swapoff -a; free -m
          cat > "$RUNNER_TEMP/watch.sh" <<'EOF'
          i=0
          while sleep 1; do
            i=$((i + 1))
            if [ $((i % 15)) -eq 0 ]; then
              { echo "=== $(date -u +%T)"; df -h / | tail -1; free -m | sed -n 2,3p; cat /proc/loadavg; echo "procs $(ps -e --no-headers | wc -l)"
                ps -eo pid,ppid,pgid,sid,etimes,pcpu,rss,args --sort=-rss | head -6 | cut -c1-220; } >> "$RUNNER_TEMP/watch.log"
            fi
            mem=$(awk '/MemAvailable/{print $2}' /proc/meminfo)
            if [ "$mem" -lt 2000000 ]; then
              top=$(ps -eo pid= --sort=-rss | head -1)
              { echo "!!! $(date -u +%T) low mem=${mem}k, killing $top"; ps -eo pid,ppid,pgid,sid,etimes,pcpu,rss,args --sort=-rss | head -25 | cut -c1-300; } | tee -a "$RUNNER_TEMP/watch.log" > "$RUNNER_TEMP/killed.log"
              kill -9 "$top"
            fi
          done
          EOF
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build tests
        run: |
          cargo nextest run --workspace --all-targets --locked --profile ci --no-run
          df -h / ; du -sh target target/* 2>/dev/null
      - name: Tests
        run: |
          grep PRETTY /etc/os-release; uname -r; ulimit -u 6000; ulimit -u
          nohup bash "$RUNNER_TEMP/watch.sh" > /dev/null 2>&1 &
          timeout -k 30 12m cargo nextest run --workspace --all-targets --locked --profile ci --failure-output=immediate --status-level=all || { code=$?; echo "nextest exit $code"; ps -eo pid,ppid,pgid,sid,etimes,stat,pcpu,rss,args --sort=-etimes | head -80 | cut -c1-250; exit 1; }
      - name: Watch log
        if: always()
        run: cat "$RUNNER_TEMP/killed.log"; cat "$RUNNER_TEMP/watch.log"; df -h /; ps -eo pid,ppid,pgid,sid,etimes,pcpu,rss,args | cut -c1-200

  macos:
    needs: scope
    if: needs.scope.outputs.skip != 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install lld
        # .cargo/config.toml links macOS with ld64.lld. brew exits 1 when llvm's post-install fails, though lld is installed.
        run: brew install lld || command -v ld64.lld
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: nextest
        run: echo "version=$(sed -n 's/^cargo-nextest = { version = "=\([^"]*\)".*/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest@${{ steps.nextest.outputs.version }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        # a_saved_shortcut_is_kept_and_announced has failed on macOS only; it does not block a merge.
        run: >-
          cargo nextest run --workspace --all-targets --locked --profile ci --failure-output=immediate --status-level=all
          -E 'not test(a_saved_shortcut_is_kept_and_announced)'

  windows:
    needs: scope
    if: needs.scope.outputs.skip != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install --profile minimal
      - name: dlltool
        # getrandom's build fails with "dlltool.exe: program not found" when MinGW is missing.
        run: |
          command -v dlltool.exe && exit 0
          choco install mingw -y --no-progress
          bin=/c/ProgramData/mingw64/mingw64/bin
          [ -x "$bin/dlltool.exe" ] || { echo "dlltool.exe not found in $bin" >&2; exit 1; }
          cygpath -w "$bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: nextest
        run: echo "version=$(sed -n 's/^cargo-nextest = { version = "=\([^"]*\)".*/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest@${{ steps.nextest.outputs.version }}
      - name: Tests
        run: cargo nextest run --workspace --all-targets --locked --profile ci --failure-output=immediate --status-level=all

  mutants:
    if: github.event_name == 'workflow_dispatch' && inputs.mutants
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Linux build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1 libasound2-dev lld
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - id: versions
        run: |
          echo "nextest=$(sed -n 's/^cargo-nextest = { version = "=\([^"]*\)".*/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
          echo "mutants=$(tr -d '[:space:]' < scripts/cargo-mutants-version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest@${{ steps.versions.outputs.nextest }},cargo-mutants@${{ steps.versions.outputs.mutants }}
      - name: Mutants on the changed lines
        run: sh scripts/mutants-diff.sh origin/main
