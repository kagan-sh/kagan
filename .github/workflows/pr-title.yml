name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - name: Follow Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: [^ ]'
          if ! printf '%s' "$TITLE" | grep -qE "$pattern"; then
            echo "::error::The squash commit on main takes the PR title. Use 'type(scope)?: summary', for example 'fix: keep the sidebar width'. Got: $TITLE"
            exit 1
          fi
