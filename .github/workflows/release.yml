name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (for example, 0.2.0)"
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      version: ${{ steps.next.outputs.version }}
      sha: ${{ steps.next.outputs.sha }}
      previous: ${{ steps.next.outputs.previous }}
      prerelease: ${{ steps.next.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: next
        name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          bash scripts/release-version.sh check "$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  package:
    needs: tag
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: macos-latest
            size-budget: 78643200
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.sha }}
      - name: Stamp version
        shell: bash
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          set -eu
          stamp() {
            file=$1
            awk -v v="$VERSION" '
              !done && $0 ~ /^version[[:space:]]*=[[:space:]]*"/ {
                sub(/"[^"]*"/, "\"" v "\"")
                done = 1
              }
              { print }
              END { if (!done) exit 1 }
            ' "$file" > "$file.tmp"
            mv "$file.tmp" "$file"
          }
          stamp Cargo.toml
      - name: macOS linker
        if: runner.os == 'macOS'
        run: brew install lld
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1 libasound2-dev libfuse2 lld
      - if: runner.os != 'Windows'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      - if: runner.os != 'Windows'
        shell: bash
        run: |
          {
            echo "CARGO_INCREMENTAL=0"
            echo "RUSTC_WRAPPER=sccache"
            echo "SCCACHE_GHA_ENABLED=true"
            echo "CMAKE_C_COMPILER_LAUNCHER=sccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache"
          } >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          cache: false
      - name: Prepare cargo-packager cache directory
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/cargo-packager"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: packager
        with:
          path: ${{ runner.temp }}/cargo-packager
          key: cargo-packager-0.11.8-${{ runner.os }}-${{ runner.arch }}
      - name: Install cargo-packager
        if: steps.packager.outputs.cache-hit != 'true'
        shell: bash
        run: cargo install cargo-packager --version 0.11.8 --locked --root "$RUNNER_TEMP/cargo-packager"
      - name: Put cargo-packager on PATH
        shell: bash
        run: echo "$RUNNER_TEMP/cargo-packager/bin" >> "$GITHUB_PATH"
      - name: Apple signing identity
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        # cargo-packager reads the certificate and notarization login from the Package step's
        # environment; the signing identity has no environment variable, so it goes in Cargo.toml.
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "Apple signing secrets unset; the dmg will be unsigned"
            exit 0
          fi
          table=""
          if ! grep -q '^\[package\.metadata\.packager\.macos\]$' crates/kg/Cargo.toml; then
            table="[package.metadata.packager.macos]"
          fi
          {
            echo
            if [ -n "$table" ]; then
              echo "$table"
            fi
            echo "signing-identity = \"$APPLE_SIGNING_IDENTITY\""
          } >> crates/kg/Cargo.toml
      - name: Windows signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE)) {
            Write-Host "Windows signing secret unset; the exe will be unsigned"
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "kagan.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $secure = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $imported = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          @"

          [package.metadata.packager.windows]
          digest-algorithm = "sha256"
          certificate-thumbprint = "$($imported.Thumbprint)"
          timestamp-url = "http://timestamp.digicert.com"
          "@ | Add-Content -Path crates/kg/Cargo.toml
      - name: Package
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          case "$RUNNER_OS" in
            Linux)
              formats=deb,appimage
              export RUSTFLAGS="-C link-arg=-fuse-ld=lld"
              ;;
            # app keeps the bundle, which "Sign the update files" packs for the updater.
            macOS) formats=app,dmg ;;
            Windows) formats=nsis ;;
            *) echo "no installer for $RUNNER_OS" >&2; exit 1 ;;
          esac
          cargo packager --release --formats "$formats"
      - name: Notarize the dmg
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # cargo-packager notarizes and staples the app inside the dmg, not the dmg itself.
        run: |
          set -eu
          if [ -z "$APPLE_SIGNING_IDENTITY" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "Apple signing or notarization secrets unset; the dmg will not be notarized"
            exit 0
          fi
          shopt -s nullglob
          dmgs=(target/packager/kagan_*_aarch64.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "expected one dmg, found ${#dmgs[@]}: ${dmgs[*]}" >&2
            exit 1
          fi
          dmg=${dmgs[0]}
          auth=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")
          if ! out=$(xcrun notarytool submit "$dmg" "${auth[@]}" --wait --output-format json); then
            echo "notarytool submit failed: $out" >&2
          fi
          id=$(jq -r '.id // empty' <<< "$out" || true)
          status=$(jq -r '.status // empty' <<< "$out" || true)
          if [ "$status" != Accepted ]; then
            echo "::error::notarization of $dmg ended with status '${status:-none}': $out"
            if [ -n "$id" ]; then
              xcrun notarytool log "$id" "${auth[@]}" || true
            fi
            exit 1
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
      - name: Name the installers
        shell: bash
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        # cargo-packager names the exe, deb and AppImage after the binary, kg.
        run: |
          set -eu
          shopt -s nullglob
          for file in target/packager/kg_*.exe target/packager/kg_*.deb target/packager/kg_*.AppImage; do
            name=${file##*/}
            name=kagan_${name#kg_}
            name=${name/-setup.exe/.exe}
            mv -- "$file" "target/packager/$name"
            echo "$file -> target/packager/$name"
          done
      # The only step that holds the update key; nothing here builds or runs crate code.
      # kagan checks these .sig files before it updates (decision 116).
      - name: Sign the update files
        shell: bash
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATER_PRIVATE_KEY_PASSWORD }}
        run: |
          set -eu
          shopt -s nullglob
          if [ -z "$CARGO_PACKAGER_SIGN_PRIVATE_KEY" ]; then
            echo "::error::UPDATER_PRIVATE_KEY is unset; a release needs signed update files"
            exit 1
          fi
          files=(target/packager/kagan_*.exe target/packager/kagan_*.AppImage)
          if [ "$RUNNER_OS" = macOS ]; then
            # The archive takes the dmg's arch, so a universal dmg gives a universal archive.
            dmgs=(target/packager/kagan_*.dmg)
            if [ "${#dmgs[@]}" -ne 1 ]; then
              echo "expected one dmg, found ${#dmgs[@]}" >&2
              exit 1
            fi
            arch=${dmgs[0]%.dmg}
            arch=${arch##*_}
            archive=target/packager/kagan_${VERSION}_${arch}.app.tar.gz
            COPYFILE_DISABLE=1 tar -czf "$archive" -C target/packager kagan.app
            files+=("$archive")
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no update file to sign" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            cargo packager signer sign "$file" > /dev/null
            echo "signed $file"
          done
      - name: Size budget
        shell: bash
        env:
          BUDGET: ${{ matrix.size-budget }}
        run: |
          set -eu
          bin=target/release/kg
          if [ "$RUNNER_OS" = Windows ]; then bin=$bin.exe; fi
          size=$(wc -c < "$bin" | tr -d ' ')
          echo "\`kg\` on $RUNNER_OS: $size bytes, budget ${BUDGET:-none}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$BUDGET" ] && [ "$size" -gt "$BUDGET" ]; then
            echo "::error::kg is $size bytes, over its $BUDGET byte budget"
            exit 1
          fi
      - if: runner.os != 'Windows'
        shell: bash
        run: ${SCCACHE_PATH:-sccache} --show-stats
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-${{ matrix.os }}
          path: |
            target/packager/*.dmg
            target/packager/*.app.tar.gz
            target/packager/*.sig
            target/packager/*.exe
            target/packager/*.deb
            target/packager/*.AppImage
          if-no-files-found: error

  publish:
    needs: [tag, package]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist
      - name: Write update.json
        env:
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # kagan reads releases/latest/download/update.json and checks update.json.sig first
          # (decisions 113 and 116).
          shopt -s nullglob
          asset() {
            local files=(dist/$2)
            if [ "${#files[@]}" -ne 1 ] || [ ! -f "${files[0]}.sig" ]; then
              echo "expected one signed $2, found ${#files[@]}" >&2
              exit 1
            fi
            local name=${files[0]#dist/}
            jq -n --arg key "$1" --arg url "https://github.com/$GH_REPO/releases/download/$TAG/$name" \
              --rawfile signature "${files[0]}.sig" '{($key): {url: $url, signature: $signature}}'
          }
          # A universal dmg serves both Mac keys from one archive; an Intel one only its own.
          mac() {
            local universal=(dist/kagan_*_universal.dmg)
            if [ "${#universal[@]}" -gt 0 ]; then
              asset "macos-$1" 'kagan_*_universal.app.tar.gz'
              return
            fi
            local own=(dist/kagan_*_"$1".app.tar.gz)
            if [ "${#own[@]}" -gt 0 ] || [ "$1" = aarch64 ]; then
              asset "macos-$1" "kagan_*_$1.app.tar.gz"
            fi
          }
          {
            mac aarch64
            mac x86_64
            asset windows-x86_64 'kagan_*_x64.exe'
            asset linux-x86_64 'kagan_*_x86_64.AppImage'
          } | jq -s --arg version "${TAG#v}" '{version: $version, platforms: add}' > dist/update.json
      - name: Prepare cargo-packager cache directory
        run: mkdir -p "$RUNNER_TEMP/cargo-packager"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: packager
        with:
          path: ${{ runner.temp }}/cargo-packager
          key: cargo-packager-0.11.8-${{ runner.os }}-${{ runner.arch }}
      - name: Install cargo-packager
        if: steps.packager.outputs.cache-hit != 'true'
        run: cargo install cargo-packager --version 0.11.8 --locked --root "$RUNNER_TEMP/cargo-packager"
      # The only step here that holds the update key; it signs the list kagan reads first.
      - name: Sign update.json
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATER_PRIVATE_KEY_PASSWORD }}
        run: |
          set -eu
          "$RUNNER_TEMP/cargo-packager/bin/cargo-packager" signer sign dist/update.json > /dev/null
          test -s dist/update.json.sig
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tag.outputs.tag }}
          SHA: ${{ needs.tag.outputs.sha }}
          PREVIOUS: ${{ needs.tag.outputs.previous }}
          PRERELEASE: ${{ needs.tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ -z "$(ls -A dist)" ]; then
            echo "no installers" >&2
            exit 1
          fi
          (cd dist && sha256sum -- * > SHA256SUMS)
          mapfile -t files < <(find dist -type f | sort)
          args=(--target "$SHA" --title "$TAG" --generate-notes)
          if [ -n "$PREVIOUS" ]; then args+=(--notes-start-tag "$PREVIOUS"); fi
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}" "${files[@]}"

  homebrew:
    needs: [tag, publish]
    if: needs.tag.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kagan-sh/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      - name: Update the cask
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tag.outputs.tag }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          set -eu
          dmg="kagan_${VERSION}_aarch64.dmg"
          sums=$(gh release download "$TAG" --pattern SHA256SUMS --output -)
          sha=$(printf '%s\n' "$sums" | awk -v f="$dmg" '$2 == f { print $1 }')
          if [ -z "$sha" ]; then
            echo "$dmg is not in SHA256SUMS" >&2
            exit 1
          fi
          sed -i \
            -e "s/^  version \".*\"$/  version \"$VERSION\"/" \
            -e "s/^  sha256 \".*\"$/  sha256 \"$sha\"/" \
            Casks/kagan.rb
          grep -qx "  version \"$VERSION\"" Casks/kagan.rb
          grep -qx "  sha256 \"$sha\"" Casks/kagan.rb
          if git diff --quiet; then
            echo "The cask is already at $VERSION"
            exit 0
          fi
          git -c user.name="kagan release" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qam "kagan $VERSION"
          git push origin HEAD:main
