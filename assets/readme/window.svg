<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 702" width="1200" height="702" role="img">
  <title>kagan</title>
  <desc>A kagan window. Threads on the left, a terminal in the center, changed files on the right. Hover a column. A plugin tool appears on the rail and draws Hello under the threads.</desc>
  <style>
    svg {
      --bg: #22262f;
      --surface: #1c1f27;
      --raised: #2f3440;
      --ink: #e5e9f0;
      --muted: #a7afbf;
      --line: #353b48;
      --accent: #f0905f;
      --added: #a8c98e;
      --failed: #ec959c;
      --working: #8fc7d6;
      --term: #1a1d24;
      --termfg: #e5e9f0;
      --term-added: #a8c98e;
      --term-failed: #ec959c;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      text-rendering: geometricPrecision;
    }
    @media (prefers-color-scheme: light) {
      svg {
        --bg: #eef1f5;
        --surface: #e4e8ee;
        --raised: #d8dee7;
        --ink: #262b36;
        --muted: #535c6c;
        --line: #d3d9e2;
        --accent: #9a4116;
        --added: #3c6a2c;
        --failed: #a62f3c;
        --working: #285f73;
      }
    }
    .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
    .hit { fill: transparent; cursor: pointer; }
    .beat { opacity: 0; animation: beat 16s infinite; }
    .b1 { animation-delay: 0s; }
    .b2 { animation-delay: -12s; }
    .b3 { animation-delay: -8s; }
    .b4 { animation-delay: -4s; }
    .plug { opacity: 0; animation: beat 16s -4s infinite; }
    .shift { animation: room 16s -4s infinite; }
    .threads-on { animation: hide 16s -4s infinite; }
    .cursor { animation: blink 1.1s step-end infinite; }
    @keyframes beat {
      0%, 20% { opacity: 1; }
      25%, 100% { opacity: 0; }
    }
    @keyframes room {
      0%, 18% { transform: translateY(34px); }
      25%, 100% { transform: translateY(0); }
    }
    @keyframes hide {
      0%, 20% { opacity: 0; }
      25%, 100% { opacity: 1; }
    }
    @keyframes blink { 50% { opacity: 0; } }
    svg:hover .beat,
    svg:hover .plug,
    svg:hover .shift,
    svg:hover .threads-on { animation: none; }
    svg:hover .beat, svg:hover .plug { opacity: 0; }
    svg:has(#hit-threads:hover) .b1,
    svg:has(#hit-terminal:hover) .b2,
    svg:has(#hit-changes:hover) .b3,
    svg:has(#hit-plugin:hover) .b4,
    svg:has(#hit-plugin-body:hover) .b4 { opacity: 1; }
    svg:has(#hit-plugin:hover) .plug,
    svg:has(#hit-plugin-body:hover) .plug { opacity: 1; }
    svg:has(#hit-plugin:hover) .shift,
    svg:has(#hit-plugin-body:hover) .shift { transform: translateY(34px); }
    svg:has(#hit-threads:hover) .threads-on { opacity: 1; }
    svg:has(#hit-plugin:hover) .threads-on,
    svg:has(#hit-plugin-body:hover) .threads-on { opacity: 0; }
  </style>
  <defs>
    <clipPath id="window"><rect width="1200" height="702" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#window)">
    <rect width="1200" height="702" fill="var(--bg)"/>
    <rect x="48" y="34" width="256" height="640" fill="var(--surface)"/>
    <rect x="304" y="34" width="576" height="640" fill="var(--term)"/>
    <rect x="880" y="34" width="320" height="640" fill="var(--surface)"/>
    <rect y="34" width="48" height="640" fill="var(--surface)"/>

    <g fill="var(--ink)" transform="translate(10.3 41.8) scale(0.0268)">
      <path d="M332.21 232C274 232 239.37 263.68 239.37 323.37V700.63C239.37 760.32 274 792 332.21 792H345.47C360.21 792 367.58 783.89 367.58 769.16V686.63C367.58 676.32 372.74 674.11 380.84 681.47L470.74 763.26C492.84 783.89 516.42 792 548.84 792H694.74C755.16 792 784.63 761.79 784.63 701.37V533.37C784.63 487.68 763.26 466.32 717.58 466.32H613.68C579.79 466.32 563.58 482.53 563.58 516.42V534.11C563.58 566.53 579.05 582.74 611.47 582.74H659.37C673.37 582.74 680 589.37 680 603.37V652C680 667.47 671.89 675.58 656.42 675.58H610.74C565.05 675.58 528.21 657.16 494.32 626.21C455.26 590.84 431.68 554 431.68 517.89C431.68 481.05 455.26 444.21 494.32 408.84C530.42 376.42 565.79 357.26 610.74 357.26H722.74C764 357.26 784.63 336.63 784.63 298.32C784.63 253.37 758.11 232 709.47 232H547.37C514.95 232 495.05 240.11 472.95 260.74L380.84 344.74C372.74 352.11 367.58 349.89 367.58 339.58V254.84C367.58 240.11 360.21 232 345.47 232H332.21Z"/>
    </g>
    <rect class="threads-on" x="10" y="68" width="28" height="28" rx="6" fill="var(--raised)"/>
    <g fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round">
      <path d="M18 78h12M18 82h12M18 86h8"/>
    </g>
    <g class="plug" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round">
      <rect x="10" y="102" width="28" height="28" rx="6" fill="var(--raised)" stroke="none"/>
      <rect x="18" y="110" width="12" height="12" rx="1.5"/>
      <path d="M22 110v12"/>
    </g>
    <g class="shift" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round">
      <rect x="17" y="108" width="5" height="5"/>
      <rect x="26" y="108" width="5" height="5"/>
      <rect x="17" y="117" width="5" height="5"/>
      <rect x="26" y="117" width="5" height="5"/>
      <path d="M24 148v8M20 152h8"/>
    </g>
    <g fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round">
      <circle cx="24" cy="612" r="5"/>
      <path d="M27.5 615.5L31 619"/>
      <circle cx="24" cy="646" r="5"/>
      <path d="M24 643v1.5M24 648.5V650M21 646h1.5M25.5 646H27M21.9 643.9l1 1M25.1 647.1l1 1M26.1 643.9l-1 1M22.9 647.1l-1 1"/>
    </g>

    <g fill="var(--ink)" font-size="13">
      <text x="78" y="64">+</text>
      <text x="96" y="64">New thread</text>
      <text x="60" y="98">weather</text>
      <text x="88" y="124">Add retry to fetch</text>
      <text x="88" y="152">Check the README</text>
    </g>
    <text x="60" y="186" fill="var(--muted)" font-size="13">Personal</text>
    <circle cx="72" cy="120" r="2" fill="var(--muted)"/>
    <rect x="68" y="144" width="8" height="8" rx="1" fill="var(--working)"/>
    <rect x="60" y="106" width="232" height="28" rx="8" fill="var(--raised)"/>
    <circle cx="72" cy="120" r="2" fill="var(--muted)"/>
    <text x="88" y="124" fill="var(--ink)" font-size="13">Add retry to fetch</text>

    <g class="plug">
      <rect x="60" y="500" width="232" height="72" rx="8" fill="var(--raised)"/>
      <text x="76" y="542" fill="var(--ink)" font-size="13">Hello</text>
    </g>
    <g fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round">
      <path d="M66 642h14v10H66z"/>
      <path d="M66 642v-3h6l2 3"/>
    </g>

    <g class="mono" font-size="12" fill="var(--termfg)">
      <text x="320" y="62">Added a retry with backoff to fetch_forecast.</text>
      <text x="320" y="84">src/fetch.py | 15 <tspan fill="var(--term-added)">++++++++++++++</tspan><tspan fill="var(--term-failed)">--</tspan></text>
      <text x="320" y="106">1 file changed, 12 insertions(+), 3 deletions(-)</text>
      <text x="320" y="150">weather %</text>
    </g>
    <rect class="cursor" x="392" y="138" width="7" height="14" fill="var(--termfg)"/>

    <rect x="880" y="34" width="320" height="36" fill="var(--surface)"/>
    <path d="M880 70h320" stroke="var(--line)"/>
    <rect x="888" y="40" width="76" height="24" rx="8" fill="var(--raised)"/>
    <text x="900" y="56" fill="var(--ink)" font-size="12">Changes</text>
    <text x="972" y="56" fill="var(--muted)" font-size="12">Details</text>
    <g class="plug">
      <text x="1032" y="56" fill="var(--muted)" font-size="12">Hello</text>
    </g>
    <g fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1132 52h8M1136 48v8"/>
      <path d="M1168 50V46h4M1184 50V46h-4M1168 58v4h4M1184 58v4h-4"/>
    </g>

    <rect x="892" y="86" width="168" height="20" rx="6" fill="none" stroke="var(--line)"/>
    <rect x="892" y="86" width="100" height="20" rx="6" fill="var(--raised)"/>
    <text x="908" y="100" fill="var(--ink)" font-size="12">Uncommitted</text>
    <text x="1004" y="100" fill="var(--muted)" font-size="12">Branch</text>
    <text x="892" y="132" fill="var(--muted)" font-size="12">1 file</text>
    <text x="936" y="132" fill="var(--added)" font-size="12">+12</text>
    <text x="966" y="132" fill="var(--failed)" font-size="12">−3</text>
    <rect x="1048" y="116" width="92" height="24" rx="8" fill="none" stroke="var(--line)"/>
    <text x="1062" y="132" fill="var(--ink)" font-size="12">Open review</text>
    <text x="892" y="166" fill="var(--muted)" font-size="13">M</text>
    <text x="912" y="166" fill="var(--ink)" font-size="13">src/fetch.py</text>
    <text x="1096" y="166" fill="var(--added)" font-size="12">+12</text>
    <text x="1126" y="166" fill="var(--failed)" font-size="12">−3</text>

    <rect y="0" width="1200" height="34" fill="var(--surface)"/>
    <path d="M0 34h1200" stroke="var(--line)"/>
    <circle cx="20" cy="17" r="6" fill="#ff5f57"/>
    <circle cx="40" cy="17" r="6" fill="#febc2e"/>
    <circle cx="60" cy="17" r="6" fill="#28c840"/>
    <text x="600" y="22" font-size="13" text-anchor="middle">
      <tspan fill="var(--ink)">Add retry to fetch</tspan><tspan fill="var(--muted)"> · weather</tspan>
    </text>
    <text x="1048" y="22" fill="var(--ink)" font-size="13">Stop</text>
    <text x="1096" y="20" fill="var(--muted)" font-size="16">···</text>
    <g fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="86" y="11" width="14" height="12" rx="2"/>
      <path d="M91 11v12"/>
      <rect x="1148" y="11" width="14" height="12" rx="2"/>
      <path d="M1157 11v12"/>
    </g>

    <rect y="674" width="1200" height="28" fill="var(--bg)"/>
    <circle cx="16" cy="688" r="3" fill="var(--muted)"/>
    <text x="28" y="692" fill="var(--muted)" font-size="12">Quiet</text>

    <g class="beat b1" fill="none" stroke="var(--accent)" stroke-width="1.5">
      <rect x="52" y="38" width="248" height="632" rx="8"/>
      <rect x="392" y="612" width="400" height="28" rx="8" fill="var(--raised)" stroke="none"/>
      <text x="600" y="631" fill="var(--ink)" font-size="13" text-anchor="middle" stroke="none">One thread. One program. Its own folder.</text>
    </g>
    <g class="beat b2" fill="none" stroke="var(--accent)" stroke-width="1.5">
      <rect x="308" y="38" width="568" height="632" rx="8"/>
      <rect x="430" y="612" width="324" height="28" rx="8" fill="var(--raised)" stroke="none"/>
      <text x="592" y="631" fill="var(--ink)" font-size="13" text-anchor="middle" stroke="none">You type to it, like any terminal.</text>
    </g>
    <g class="beat b3" fill="none" stroke="var(--accent)" stroke-width="1.5">
      <rect x="884" y="38" width="312" height="632" rx="8"/>
      <rect x="360" y="612" width="464" height="28" rx="8" fill="var(--raised)" stroke="none"/>
      <text x="592" y="631" fill="var(--ink)" font-size="13" text-anchor="middle" stroke="none">The files it changed. You send comments back.</text>
    </g>
    <g class="beat b4" fill="none" stroke="var(--accent)" stroke-width="1.5">
      <rect x="4" y="38" width="40" height="632" rx="8"/>
      <rect x="56" y="496" width="240" height="80" rx="8"/>
      <rect x="318" y="612" width="548" height="28" rx="8" fill="var(--raised)" stroke="none"/>
      <text x="592" y="631" fill="var(--ink)" font-size="13" text-anchor="middle" stroke="none">A plugin adds a tool. It runs only after you allow it.</text>
    </g>
  </g>
  <rect id="hit-threads" class="hit" x="48" y="34" width="256" height="460"/>
  <rect id="hit-terminal" class="hit" x="304" y="34" width="576" height="640"/>
  <rect id="hit-changes" class="hit" x="880" y="34" width="320" height="640"/>
  <rect id="hit-plugin" class="hit" x="0" y="34" width="48" height="640"/>
  <rect id="hit-plugin-body" class="hit" x="48" y="494" width="256" height="180"/>
</svg>
