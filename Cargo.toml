[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
repository = "https://github.com/kagan-sh/kagan"

[workspace.dependencies]
kg-core = { path = "crates/core" }
kg-domain = { path = "crates/domain" }
kg-process = { path = "crates/process" }
kg-plugins = { path = "crates/plugins" }
kg-store = { path = "crates/store" }
kg-terminal = { path = "crates/terminal" }
kg-ui = { path = "crates/ui" }

anyhow = "=1.0.104"
proptest = "=1.12.0"
async-channel = "=2.5.0"
clap = { version = "=4.6.7", features = ["derive", "env"] }
dunce = "=1.0.5"
futures = "=0.3.34"
# SQL is left out: tree-sitter-sequel requires cc 1.2, and this build already
# uses cc 1.10. Cargo will not keep both (decision 173).
gpui-kit = { git = "https://github.com/kagan-sh/gpui-kit", rev = "cbba719b24571c7b01d16dcc9e8887871be32b3a", features = [
    "tree-sitter-astro",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cmake",
    "tree-sitter-cpp",
    "tree-sitter-csharp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-ejs",
    "tree-sitter-elixir",
    "tree-sitter-erb",
    "tree-sitter-go",
    "tree-sitter-graphql",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-jsdoc",
    "tree-sitter-kotlin",
    "tree-sitter-lua",
    "tree-sitter-make",
    "tree-sitter-markdown",
    "tree-sitter-php",
    "tree-sitter-proto",
    "tree-sitter-python",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-scala",
    "tree-sitter-svelte",
    "tree-sitter-swift",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
    "tree-sitter-zig",
] }
gpui-shell = { git = "https://github.com/kagan-sh/gpui-kit", rev = "cbba719b24571c7b01d16dcc9e8887871be32b3a", default-features = false, features = ["quickjs", "components"] }
gpui-webview = { git = "https://github.com/kagan-sh/gpui-kit", rev = "cbba719b24571c7b01d16dcc9e8887871be32b3a", default-features = false, features = ["gpui-fast"] }
hex = "=0.4.3"
interprocess = "=2.4.8"
keyring-core = "=1.0.1"
libc = "=0.2.191"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false }
objc2-foundation = { version = "=0.3.2", default-features = false }
rustix = { version = "=1.1.6", features = ["process"] }
semver = "=1.0.28"
sha2 = "=0.11.1"
tempfile = "=3.27.0"
url = "=2.5.8"
uuid = { version = "=1.29.2", features = ["v4"] }
rusqlite = { version = "=0.41.1", features = ["bundled", "fallible_uint"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
widestring = "=1.2.1"
wry = { version = "=0.53.3", package = "lb-wry" }
raw-window-handle = "=0.6.2"
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
cognitive_complexity = "warn"
dbg_macro = "deny"
expect_used = "deny"
pedantic = { level = "warn", priority = -1 }
print_stdout = "deny"
todo = "deny"
too_many_arguments = "warn"
too_many_lines = "warn"
unwrap_used = "deny"
disallowed_types = "deny"

[workspace.metadata.bin]
cargo-nextest = { version = "=0.9.151", locked = true }

# The Browser's web view. Camera and microphone are refused, and Windows hosts the page in a composition visual (decision 131).
# A lost DirectX device is logged and the window stays, and a panic in the window procedure does not abort the process (decisions 166 and 168).
[patch.crates-io]
lb-wry = { git = "https://github.com/kagan-sh/wry", rev = "c13dc021f4d5f80f7425c5580fa2f6d1346cb308" }
gpui-fast-windows = { git = "https://github.com/kagan-sh/gpui-fast", rev = "f4688adc671add4ffa274d92cdb9b7cdfddeec71" }

# Line tables keep panic locations. Full debug info dominates link time and the target directory.
# unpacked skips dsymutil on macOS. Cargo ignores this value on MSVC, which only supports packed.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# At opt-level 0, gpui-shell and its component catalog push a binary's unwind tables past
# the 16 MB the macOS linker can index.
[profile.dev.package."*"]
opt-level = 1

# Panics stay unwinding: gpui-shell and `ui` catch a plugin's panic instead of losing the app.
[profile.mutants]
inherits = "test"
debug = "none"

[profile.release]
lto = "thin"
strip = "symbols"

# rustc's strip (llvm-objcopy) misaligns a proc-macro dylib's LINKEDIT string pool.
# macOS 27 dyld refuses to load it. The app binary stays stripped.
[profile.release.build-override]
strip = "none"
