# cargo-mutants skips these. Each entry names the mutant it skips and why no test can catch it.

profile = "mutants"

exclude_globs = [
    "crates/*/src/tests/**",
    "crates/*/tests/**",
    "**/tests.rs",
    "**/*_test.rs",
]

exclude_re = [
    # Required by gpui-kit Collapsible for SidebarItem; nothing reads it.
    'sidebar\.rs:\d+:\d+: replace <impl Collapsible for Row>::is_collapsed -> bool with true',
    # `highlight` returns early for "text" or an empty source. Without it, `highlight_cached` gives
    # the same empty result for "text", so the early return only saves a parse.
    'syntax\.rs:\d+:\d+: replace \|\| with && in highlight\b',
    # The limit compares two clock readings; > and >= differ only within the same nanosecond.
    'process\.rs:\d+:\d+: replace > with >= in Process::wait_within',
    # The Windows and macOS clipboard write. CI's mutants run on Linux, which compiles the other write_png.
    'clipboard\.rs:25:5: replace write_png -> Result<HostValue, HostError> with Ok\(Default::default\(\)\)',
    # The production stub is compiled only outside tests; the test build has its own hold.
    'host/mod\.rs:\d+:\d+: replace hold -> bool with true',
    # The keychain module is compiled out of every test build, and it talks to the OS keychain.
    'keychain\.rs:\d+:\d+: replace use_keychain with \(\)',
    'keychain\.rs:\d+:\d+: replace <impl keyring_core::api::CredentialStoreApi for Keychain>::vendor',
]
