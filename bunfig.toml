[install]
exact = true
# Only install newly resolved package versions published at least 3 days ago (needs Bun >= 1.3).
minimumReleaseAge = 259200

[test]
include = ["test/**/*.test.ts", "test/**/*.test.tsx"]
# test/integration runs in its own `bun test` invocation (see package.json "test") so it gets a
# process free of the module mocks other test files register globally — it needs the real git runner.
exclude = ["references/**", "test/integration/**"]
# Compile test TSX with the real Solid reactive transform. Without it, Bun's plain
# automatic JSX runtime evaluates every JSX expression exactly once and nothing on
# the board ever repaints. The opencode host applies this same transform itself when
# importing raw plugin .tsx; bun test has no host, so tests opt in here.
preload = ["@opentui/solid/preload", "./test/preload/git-isolation.ts"]
