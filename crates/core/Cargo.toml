[package]
name = "kg-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kg-domain.workspace = true
kg-process.workspace = true
kg-store.workspace = true
kg-terminal.workspace = true
gpui-kit.workspace = true
async-channel.workspace = true
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["alloc"] }
dunce.workspace = true
futures.workspace = true
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
minisign-verify = "=0.3.0"
reqwest = { package = "gpui-pre-reqwest", version = "=0.12.15", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
flate2 = "=1.1.10"
libc.workspace = true
tar = { version = "=0.4.46", default-features = false }

[features]
test = []

[lints]
workspace = true

[dev-dependencies]
proptest.workspace = true
minisign = "=0.10.0"
gpui-kit = { workspace = true, features = ["test-support"] }
rusqlite.workspace = true
tempfile.workspace = true
