[package]
name = "kg-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kg-domain.workspace = true
kg-process.workspace = true
kg-store.workspace = true
kg-terminal.workspace = true
gpui-kit.workspace = true
async-channel.workspace = true
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["alloc"] }
dunce = "=1.0.5"
futures = "=0.3.34"
minisign-verify = "=0.3.0"
reqwest = { package = "gpui-pre-reqwest", version = "=0.12.15", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
semver = "=1.0.28"
serde.workspace = true
serde_json.workspace = true
uuid = { version = "=1.26.1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
flate2 = "=1.1.10"
tar = "=0.4.46"

[features]
test-support = []

[lints]
workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
rusqlite.workspace = true
tempfile = "=3.27.0"
