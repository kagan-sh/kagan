[package]
name = "kg-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kg-core.workspace = true
kg-domain.workspace = true
kg-plugins.workspace = true
gpui-kit.workspace = true
gpui-shell.workspace = true
async-channel.workspace = true
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true
url = "=2.5.8"

[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
raw-window-handle.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSString"] }
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSDockTile", "NSImage", "NSBitmapImageRep", "NSImageRep", "std"] }

[target.'cfg(target_os = "windows")'.dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
dunce = "=1.0.5"
kg-core = { workspace = true, features = ["test-support"] }
kg-store.workspace = true
tempfile = "=3.27.0"
gpui-kit = { workspace = true, features = ["test-support", "tree-sitter-diff"] }

[lints]
workspace = true
