[package]
name = "kg-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kg-core.workspace = true
kg-domain.workspace = true
kg-plugins.workspace = true
gpui-kit.workspace = true
gpui-shell.workspace = true
async-channel.workspace = true
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true
url.workspace = true
percent-encoding = "=2.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
raw-window-handle.workspace = true
# GPUI Fast draws menus over the native page.
gpui-kit = { workspace = true, features = ["gpui-fast"] }
gpui-shell = { workspace = true, features = ["gpui-fast"] }
gpui-webview.workspace = true
wry.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { workspace = true, features = ["NSString", "NSProcessInfo"] }
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSDockTile", "NSImage", "NSBitmapImageRep", "NSImageRep", "std"] }

[target.'cfg(target_os = "windows")'.dependencies]
tempfile.workspace = true
image = { version = "=0.25.10", default-features = false, features = ["png"] }
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_WindowsAndMessaging"] }
gpui-webview = { workspace = true, features = ["windows-composition"] }

[dev-dependencies]
dunce.workspace = true
kg-core = { workspace = true, features = ["test-support"] }
kg-store.workspace = true
tempfile.workspace = true
gpui-kit = { workspace = true, features = ["test-support", "tree-sitter-diff"] }

[lints]
workspace = true
