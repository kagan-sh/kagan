[package]
name = "kg-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kg-process.workspace = true
kg-core.workspace = true
kg-domain.workspace = true
async-channel.workspace = true
cap-std = "=4.0.3"
async-io = "=2.6.0"
dunce.workspace = true
futures.workspace = true
gpui-kit.workspace = true
gpui-shell.workspace = true
indexmap = { version = "=2.14.2", features = ["serde"] }
jsonschema = { version = "=0.60.2", default-features = false }
keyring-core.workspace = true
semver.workspace = true
rusqlite = { workspace = true, features = ["hooks"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile.workspace = true
uuid.workspace = true
tree-sitter = "=0.26.13"
tree-sitter-javascript = "=0.25.0"
url.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
wry.workspace = true
objc2-foundation = { workspace = true, features = ["NSProcessInfo"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
kg-core = { workspace = true, features = ["test"] }
kg-store.workspace = true

[lints]
workspace = true
