[package]
name = "kg-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kg-process.workspace = true
kg-core.workspace = true
kg-domain.workspace = true
async-channel.workspace = true
cap-std = "=4.0.3"
async-io = "=2.6.0"
dunce = "=1.0.5"
futures = "=0.3.34"
gpui-kit.workspace = true
gpui-shell.workspace = true
indexmap = { version = "=2.14.2", features = ["serde"] }
jsonschema = { version = "=0.58.3", default-features = false }
keyring-core.workspace = true
semver = "=1.0.28"
rusqlite = { workspace = true, features = ["hooks"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile = "=3.27.0"
uuid = { version = "=1.26.1", features = ["v4"] }
tree-sitter = "=0.26.13"
tree-sitter-javascript = "=0.25.0"
url = "=2.5.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
kg-store.workspace = true

[lints]
workspace = true
